<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{% if description%}{{ description | escape }}{% else %}{{ site.description }}{% endif %}" />
    <title>{% if title == 'Index' %}Black Python Devs{% elif title %}{{ title }} | Black Python Devs{% else %}Black Python Devs{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/pico.min.css' }}" />
    <link rel="stylesheet" href="{{ '/assets/css/pico.colors.min.css' }}" />
    <link rel="stylesheet" href="{{ '/assets/css/bpd.css' }}" />
    {% set lang_slash = lang %}
    {% set default_url = url%}
    {% if lang == "en" %}
    <link rel="alternate" hreflang="en" href="{{ site.url }}{{ default_url }}" />
    <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ default_url }}" />
    {% else %}
    <link rel="alternate" hreflang="{{ lang }}" href="{{ site.url }}/{{ lang }}{{ default_url }}" />
    {% endif %}
  </head>

  <body>
    {%- include '_includes/header.html' -%}
    <main class="container" role="main" aria-label="Content">

      {% block content %}
      {% if content %}
      <section>
      {{content}}
      </section>
      {% endif %}
      {% endblock %}
    </main>
    {%- include '_includes/footer.html' -%}
    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/bpd.js"></script>
    <script src="https://kit.fontawesome.com/1bbe56de49.js" crossorigin="anonymous"></script>
  </body>
</html>
