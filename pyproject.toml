[project]
name = "blackpythondevs-site"
version = "0.1.0"
description = "Black Python Devs community website"
requires-python = ">=3.13"
dependencies = [
  "render-engine>=2026.5.2a1",
  "render-engine-clean-urls==0.1.0",
  "folium>=0.20.0",
  "click==8.4.2",
  "pycountry==26.2.16",
  "python-slugify>=8.0.4",
  "pluggy>=1.6.0",
  "render-engine-markdown>=2023.12.1",
  "requests>=2.34.2",
  "render-engine-cli>=2025.11.1",
]

[dependency-groups]
dev = [
  "pin-versions==2026.3.6",
  "pre-commit==4.6.1",
  "typer==0.27.0",
  "rich==15.0.0",
  "python-frontmatter==1.3.0",
  "pytest==9.1.1",
  "ruff==0.16.1",
  "deptry>=0.25.1",
]

[tool.render-engine.cli]
module = "app"
site = "app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.deptry]
known_first_party = ["map"]
# check_author_list.py is a dev-only pre-commit hook, not part of the site
# build, so its dev-group deps (frontmatter) shouldn't be scanned as build deps.
extend_exclude = ["scripts/check_author_list.py"]

[tool.deptry.per_rule_ignores]
DEP002 = ["render-engine-cli"]
